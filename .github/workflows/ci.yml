name: CI

on:
  push:
    # The Vibe_OS default branch is `main`; `master` is kept from the original
    # standalone Buitenzorg repo.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # Multi-arch M5: one job builds the kernels for all three architectures and
  # every boot image; a matrix then boots them, one leg per architecture, each
  # with the same milestone-marker smoke test (scripts/smoke-test.sh) in
  # strict mode -- a leg whose QEMU / firmware / image is missing fails
  # instead of skipping its boots.
  build:
    name: Kernel (Rust) — build x86-64 / ARM64 / RISC-V + images
    runs-on: ubuntu-latest
    # Buitenzorg lives in a subfolder of the Vibe_OS repo.
    defaults:
      run:
        working-directory: Buitenzorg
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by kernel/rust-toolchain.toml)
        working-directory: Buitenzorg/kernel
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Buitenzorg/kernel

      # Multi-arch boundary (PLAN.md v1.x, M0): generic kernel modules may not
      # use the x86_64 crate, inline asm or port I/O outside arch/ + platform/.
      - name: Arch boundary check
        run: bash scripts/check-arch-boundary.sh

      - name: ABI contract tests
        working-directory: Buitenzorg/kernel
        run: cargo test -p bz-abi

      # Limine binaries (pinned + SHA-256): bzimage then also builds the
      # Limine images (x86-64 UEFI, ARM64, RISC-V).
      - name: Fetch Limine
        run: bash scripts/fetch-limine.sh

      # Raspberry Pi firmware (pinned + SHA-256): bzimage then also builds the
      # SD card image.
      - name: Fetch Raspberry Pi firmware
        run: bash scripts/fetch-rpi4-firmware.sh

      - name: Build ARM64 kernel
        working-directory: Buitenzorg/kernel
        run: cargo build --release -p bzkernel --target aarch64-unknown-none-softfloat

      - name: Build RISC-V kernel
        working-directory: Buitenzorg/kernel
        run: cargo build --release -p bzkernel --target riscv64imac-unknown-none-elf

      # The managed C# runtime: RustCLR as a ring-3 host (/disk/CLRHOST.ELF)
      # for every architecture; fetches RustCLR at the pinned commit.
      - name: Build managed runtime host (RustCLR)
        run: bash scripts/build-clrhost.sh

      # The x86-64 kernel + every image (bzimage also compiles the RISC-V
      # user programs in userland/riscv) -> dist/.
      - name: Build x86-64 kernel + boot images
        working-directory: Buitenzorg/kernel
        run: cargo run --release -p bzimage -- --out ../dist

      - name: Upload boot images
        uses: actions/upload-artifact@v4
        with:
          name: boot-images
          path: Buitenzorg/dist/*.img
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: Boot smoke test — ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            packages: qemu-system-x86 ovmf
          - arch: aarch64
            packages: qemu-system-arm qemu-efi-aarch64
          - arch: riscv64
            packages: qemu-system-misc qemu-efi-riscv64
            # Ubuntu 26.04 moved qemu-system-riscv64 out of qemu-system-misc into qemu-system-riscv
            extra: qemu-system-riscv
    defaults:
      run:
        working-directory: Buitenzorg
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU + firmware (${{ matrix.arch }})
        run: |
          sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
          if [ -n "${{ matrix.extra }}" ]; then sudo apt-get install -y ${{ matrix.extra }} || echo "no package ${{ matrix.extra }} (older Ubuntu: part of the packages above)"; fi

      - name: Download boot images
        uses: actions/download-artifact@v4
        with:
          name: boot-images
          path: Buitenzorg/dist

      - name: Boot smoke test (${{ matrix.arch }})
        env:
          SMOKE_ARCH: ${{ matrix.arch }}
          SMOKE_STRICT: "1"
          SMOKE_NO_BUILD: "1"
        run: bash scripts/smoke-test.sh

      # Performance regression gate (requirements.md: "benchmark regression
      # checks in CI"). Budgets are loose on purpose — this catches a real
      # regression, not runner-to-runner jitter.
      - name: Performance benchmark
        if: matrix.arch == 'x86_64'
        run: bash scripts/bench.sh

      # The serial logs of every boot, pass or fail -- what to read when a leg
      # goes red.
      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs-${{ matrix.arch }}
          path: Buitenzorg/dist/*.log
          if-no-files-found: ignore
          retention-days: 7

  managed:
    name: Runtime + SDK (.NET) — build, test
    runs-on: ubuntu-latest
    # Buitenzorg lives in a subfolder of the Vibe_OS repo.
    defaults:
      run:
        working-directory: Buitenzorg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Buitenzorg.slnx -c Release

      - name: Test
        run: dotnet test Buitenzorg.slnx -c Release --no-build

      - name: Managed apps (Buitenzorg.UI) self-tests on .NET
        # Every managed app drives its own UI headlessly (clicks, keys,
        # bindings, popups); on the device the boot runs a subset under RustCLR.
        run: |
          dotnet build userland/clr-apps/Managed/Managed.csproj -c Release -nologo -v q
          dotnet userland/clr-apps/Managed/bin/Release/net10.0/Managed.dll --selftest all

      - name: bz CLI self-check
        run: |
          dotnet run --project sdk/bz -c Release -- version
          dotnet run --project sdk/bz -c Release -- manifest validate sdk/templates/console-csharp/app.manifest
