[package]
name = "opus-pure"
version = "0.2.3"
edition = "2024"
license = "BSD-3-Clause"
description = "opus-pure 0.2.3, vendored with a no_std patch for Buitenzorg's CLR host -- see NOTICE.md"

[dependencies]
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
libm = "0.2"
spin = { version = "0.9", default-features = false, features = ["lazy", "once", "spin_mutex"] }

[lints.rust]
unexpected_cfgs = "allow"
