[package]
name = "bzkernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Buitenzorg OS kernel (Rust, ring 0)"

[dependencies]
bz-abi = { path = "../abi" }
bootloader_api = "0.11"
x86_64 = "0.15"
spin = "0.9"
pic8259 = "0.11"
pc-keyboard = "0.7"
linked_list_allocator = "0.10"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = [
    "regular",
    "size_16",
    "unicode-basic-latin",
] }
