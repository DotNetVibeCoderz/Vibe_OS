[package]
name = "bzkernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Buitenzorg OS kernel (Rust, ring 0)"

[dependencies]
bz-abi = { path = "../abi" }
spin = "0.9"
pc-keyboard = "0.7"
linked_list_allocator = "0.10"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = [
    "regular",
    "bold",
    "size_16",
    "size_24",
    "unicode-basic-latin",
] }

# PC-only crates (the x86-64 kernel: bootloader hand-off, CPU structures, 8259).
[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader_api = "0.11"
x86_64 = "0.15"
pic8259 = "0.11"
