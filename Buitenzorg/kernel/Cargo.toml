[workspace]
resolver = "2"
members = ["abi", "bzkernel", "bzimage"]
# bzkernel is not a default member: it only builds for x86_64-unknown-none and
# is pulled in by bzimage as an artifact dependency with the correct target.
# (Building it for the host would even ICE: x86-interrupt ABI on MSVC.)
default-members = ["abi", "bzimage"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Buitenzorg OS Project"]
license = "MIT"

[profile.release]
panic = "abort"
lto = true

# The kernel is optimised for size: the x86-64 kernel goes from 3.07 MB to
# 1.46 MB (stripped). Under QEMU that is ~2.5 s less boot -- the BIOS loader
# reads the kernel through int 13h at ~1.2 s per MB -- and the kernel's own
# part of the boot ran 2.4x faster (355 -> 145 ms to the first desktop frame):
# most boot code runs once, so TCG spends its time translating code, and less
# code is less to translate. "z" was 4 % smaller and no faster; size-optimised
# dependencies saved 7 KB.
[profile.release.package.bzkernel]
opt-level = "s"

[profile.dev]
panic = "abort"
