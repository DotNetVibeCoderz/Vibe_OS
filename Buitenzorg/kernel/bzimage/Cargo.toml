[package]
name = "bzimage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Builds bootable Buitenzorg OS disk images (UEFI + BIOS) and runs them in QEMU"

[dependencies]
ovmf-prebuilt = "0.2"

[build-dependencies]
bootloader = "0.11"
# The loader's log settings (bootloader::BootConfig): its framebuffer log is
# what made a BIOS boot take ~9 s under QEMU before the kernel even ran.
bootloader-boot-config = "0.11"
# Decodes the official wallpapers (assets/wallpapers/*.jpg) at image-build time;
# the kernel itself only reads 24-bit BMP.
jpeg-decoder = { version = "0.3", default-features = false }
# Writes the FAT partition of the Limine image (multi-arch M1).
fatfs = "0.3"
bzkernel = { path = "../bzkernel", artifact = "bin", target = "x86_64-unknown-none" }
