name: CI

on:
  push:
    # The repository's default branch is `master`; `main` is listed too so the
    # workflow keeps firing if it is ever renamed. Without `master` here CI
    # never ran on a push at all.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  kernel:
    name: Kernel (Rust) — build, test, boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Install Rust toolchain (pinned by kernel/rust-toolchain.toml)
        working-directory: kernel
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel

      - name: ABI contract tests
        working-directory: kernel
        run: cargo test -p bz-abi

      - name: Build kernel + boot images
        working-directory: kernel
        run: cargo build --release

      - name: Boot smoke test (QEMU, BIOS)
        run: bash scripts/smoke-test.sh

      # Performance regression gate (requirements.md: "benchmark regression
      # checks in CI"). Budgets are loose on purpose — this catches a real
      # regression, not runner-to-runner jitter.
      - name: Performance benchmark
        run: bash scripts/bench.sh

  managed:
    name: Runtime + SDK (.NET) — build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Buitenzorg.slnx -c Release

      - name: Test
        run: dotnet test Buitenzorg.slnx -c Release --no-build

      - name: bz CLI self-check
        run: |
          dotnet run --project sdk/bz -c Release -- version
          dotnet run --project sdk/bz -c Release -- manifest validate sdk/templates/console-csharp/app.manifest
